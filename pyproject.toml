[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-paper-domain-trl"
version = "0.1.0"
description = "Per-fine-topic, same-carrier TRL comparison for one document"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
energy-paper-domain-trl = "energy_paper_domain_trl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
